<div class="app-shell">
  <!-- Navigation Bar -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
        </div>
        <div>
          <h1 class="brand-name">FinLedger</h1>
          <p class="brand-subtitle">Personal Finance Management System</p>
        </div>
      </div>

      <div class="header-right">
        <div class="status-indicator" title="Connected to Spring Boot REST Backend on port 8080">
          <span class="status-dot"></span>
          <span class="status-label">Spring Boot API</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <app-dashboard></app-dashboard>
  </main>

  <!-- Global Toast Notifications -->
  <app-toast-container></app-toast-container>

  <!-- App Footer -->
  <footer class="app-footer">
    <div class="footer-inner">
      <p class="footer-copy">
        &copy; {{ currentYear }} FinLedger. Enterprise Full-Stack Portfolio Application.
      </p>
      <div class="tech-pills">
        <span class="tech-pill">Spring Boot 3.4</span>
        <span class="tech-pill">Angular 19</span>
        <span class="tech-pill">PostgreSQL</span>
        <span class="tech-pill">Hibernate JPA</span>
      </div>
    </div>
  </footer>
</div>
