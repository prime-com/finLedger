# ===================================================================
# FinLedger Application Configuration
# ===================================================================

# Server Port
# Respects the cloud platform's dynamic PORT environment variable (e.g. Render)
# while defaulting to 8080 for local development
server.port=${PORT:${SERVER_PORT:8080}}

# Application Identity
spring.application.name=finledger

# PostgreSQL Datasource Configuration
# Injected via environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
# Compatible with Neon managed PostgreSQL (requires sslmode=require) as well as local PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finledger_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Sized appropriately for serverless/managed databases (e.g., Neon free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate ORM Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# CORS Configuration
# Always permits http://localhost:4200 and accepts a deployed FRONTEND_URL or CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
