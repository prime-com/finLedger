# ===================================================================
# FinLedger Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Identity
spring.application.name=finledger

# PostgreSQL Datasource Configuration
# Values are injected from environment variables with sensible local defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finledger_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate ORM Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# CORS Configuration (Angular frontend)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
